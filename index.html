<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ascendancy Writer — Fiction Workspace</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="brand-section">
      <div class="brand-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span>Ascendancy</span>
      </div>
      <span class="brand-badge">Writer</span>
      <button class="btn-icon" id="btnToggleLeftPanel" title="Toggle Manuscript Navigation" style="margin-left: 6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>
    </div>

    <!-- Main Navigation -->
    <nav class="nav-links">
      <button class="nav-btn active" data-view="dashboard">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-btn" data-view="manuscript">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>Manuscript</span>
      </button>
      <button class="nav-btn" data-view="story_bible">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
        <span>Story Bible</span>
      </button>
      <button class="nav-btn" data-view="canon_control">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>Canon Control</span>
      </button>
      <button class="nav-btn" data-view="ai_studio">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span>AI Studio</span>
      </button>
      <button class="nav-btn" data-view="settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Settings</span>
      </button>
    </nav>

    <!-- Header Actions -->
    <div class="header-actions">
      <button class="btn" id="btnGlobalSearch" style="font-size: 11px; padding: 4px 10px; color: var(--text-secondary);">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Search</span>
        <kbd style="margin-left: 6px; font-size: 9px; opacity: 0.6; background: var(--bg-surface-elevated); padding: 1px 4px; border-radius: 3px; border: 1px solid var(--border-color);">⌘K</kbd>
      </button>
      <button class="btn-icon" id="btnToggleRightPanel" title="Toggle Context & AI Sidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Three-Panel Workspace -->
  <main class="app-workspace">
    <!-- Left Panel: Chapters & Navigation -->
    <aside class="panel-left" id="panelLeft">
      <!-- Injected by Manuscript.renderLeftPanel -->
    </aside>

    <!-- Center Workspace: Editor or Full-Width Views -->
    <section class="work-area" id="mainContentArea">
      <!-- Injected by Active View (Dashboard, Manuscript, Story Bible, etc.) -->
    </section>

    <!-- Right Panel: Context, Critics, Assistant, Analysis -->
    <aside class="panel-right" id="panelRight">
      <!-- Right Tabs -->
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="context">Context</button>
        <button class="tab-btn" data-tab="critics">Critics</button>
        <button class="tab-btn" data-tab="assistant">Assistant</button>
        <button class="tab-btn" data-tab="analysis">Analysis</button>
      </div>
      <div class="panel-content" id="panelRightContent">
        <!-- Injected dynamically based on rightTab -->
      </div>
    </aside>
  </main>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Application Scripts -->
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/manuscript.js"></script>
  <script src="js/components/story_bible.js"></script>
  <script src="js/components/canon_control.js"></script>
  <script src="js/components/ai_studio.js"></script>
  <script src="js/components/context_panel.js"></script>
  <script src="js/components/chapter_analysis.js"></script>
  <script src="js/components/history.js"></script>
  <script src="js/components/search_modal.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
